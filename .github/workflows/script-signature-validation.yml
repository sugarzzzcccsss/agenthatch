name: Script signature PR validation
on:
  push:
    branches: [validation/script-signatures-20261027]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 85228986cab781597472e16f84289711e9d1c772
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify tested commit
        run: test "$(git rev-parse HEAD)" = "85228986cab781597472e16f84289711e9d1c772"
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src/ tests/test_script_signatures.py
      - name: Type check
        run: mypy --strict --python-version ${{ matrix.python-version }} src/agenthatch
      - name: Test
        run: python -m pytest -q
      - name: Check installed dependencies
        run: python -m pip check
